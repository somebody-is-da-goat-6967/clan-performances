<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clan Tracker</title>
<style>
  :root { --bg:#fff; --fg:#1a1d21; --muted:#6b7280; --line:#e5e7eb; --head:#f3f4f6; --accent:#2563eb; --good:#15803d; --bad:#b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --fg:#e6e8eb; --muted:#9aa1ab; --line:#2a2e35; --head:#1d2026; --accent:#6ea0ff; --good:#4ade80; --bad:#f87171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif; }
  header { padding:14px 16px 0; }
  h1 { font-size:18px; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:12px; }
  .tabs { display:flex; gap:2px; overflow-x:auto; padding:10px 16px 0; border-bottom:1px solid var(--line); }
  .tab { border:0; background:none; color:var(--muted); padding:8px 12px; cursor:pointer; font:inherit; border-bottom:2px solid transparent; white-space:nowrap; }
  .tab[aria-selected=true] { color:var(--fg); border-bottom-color:var(--accent); font-weight:600; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; padding:10px 16px; align-items:center; }
  .bar input, .bar select, .bar button { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  .bar label { color:var(--muted); display:flex; gap:4px; align-items:center; }
  .count { margin-left:auto; color:var(--muted); }
  .wrap { overflow:auto; max-height:calc(100vh - 170px); border-top:1px solid var(--line); }
  table { border-collapse:collapse; width:100%; }
  th, td { padding:6px 10px; border-bottom:1px solid var(--line); white-space:nowrap; text-align:left; }
  th { position:sticky; top:0; background:var(--head); cursor:pointer; user-select:none; font-weight:600; }
  th.num, td.num { text-align:right; font-variant-numeric:tabular-nums; }
  th .arrow { color:var(--accent); margin-left:4px; }
  tr:hover td { background:var(--head); }
  .win { color:var(--good); } .loss { color:var(--bad); } .muted { color:var(--muted); }
  .note { padding:8px 16px; color:var(--muted); font-size:12px; }
  .err { padding:8px 16px; color:var(--bad); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Clan Tracker</h1>
  <div class="sub" id="meta">Loading…</div>
</header>
<nav class="tabs" id="tabs" role="tablist"></nav>
<div class="bar">
  <input id="q" type="search" placeholder="Search name or tag">
  <select id="clan"><option value="">All clans</option></select>
  <label id="formerWrap"><input type="checkbox" id="former"> Show former members</label>
  <button id="csv">Download CSV</button>
  <span class="count" id="count"></span>
</div>
<div id="errs" class="err"></div>
<div class="wrap"><table id="table"></table></div>
<div class="note" id="note"></div>

<script>
const fmtDate = v => v ? v.slice(0, 10) : "";
const star = v => v == null ? "" : v;
const result = v => v ? `<span class="${v === 'win' ? 'win' : v === 'loss' ? 'loss' : 'muted'}">${v}</span>` : "";
// col: [key, label, opts] opts: num, fmt (text), html
const C = (key, label, o = {}) => ({ key, label, ...o });

const TABS = {
  members: { label: "Members", file: "members.json", former: true,
    note: "Everyone currently in a tracked clan, plus former members if ticked. Default sort: Town Hall high to low.",
    cols: [C("th","TH",{num:1}), C("name","Name"), C("tag","Tag"), C("clan","Clan"), C("role","Role"),
           C("league","League"), C("trophies","Trophies",{num:1}), C("bestTrophies","Best",{num:1}),
           C("warStars","War stars",{num:1}), C("attackWins","Atk wins",{num:1}), C("donations","Donated",{num:1}),
           C("donationsReceived","Received",{num:1}), C("warPreference","War pref"), C("capitalContributions","Capital",{num:1}),
           C("status","Status"), C("firstSeen","First seen",{fmt:fmtDate}), C("lastSeen","Last seen",{fmt:fmtDate})] },
  ranked: { label: "Ranked", file: "ranked.json",
    note: "Ranked battle performance from each player's current and previous league group. Empty cells mean the API did not return that field.",
    cols: [C("th","TH",{num:1}), C("name","Name"), C("tag","Tag"), C("clan","Clan"), C("season","Season"), C("seasonId","Season ID"),
           C("tier","League tier"), C("rankedTrophies","Trophies",{num:1}), C("rank","Rank",{num:1}),
           C("attacks","Attacks",{num:1}), C("attackStars","Atk stars",{num:1}), C("threeStars","3★",{num:1}),
           C("attackAvgDestruction","Avg destr %",{num:1}), C("defenses","Defenses",{num:1}), C("defenseStars","Def stars",{num:1})] },
  war_summary: { label: "War summary", file: "war_summary.json",
    note: "Totals over regular wars that have ended and been recorded since tracking began.",
    cols: [C("th","TH",{num:1}), C("name","Name"), C("tag","Tag"), C("clan","Clan"), C("wars","Wars",{num:1}),
           C("attacksUsed","Attacks",{num:1}), C("attacksAvailable","Available",{num:1}), C("missed","Missed",{num:1}),
           C("stars","Stars",{num:1}), C("threeStars","3★",{num:1}), C("avgStarsPerAttack","Stars/atk",{num:1}), C("avgDestruction","Avg destr %",{num:1})] },
  wars: { label: "Wars", file: "wars.json",
    note: "One row per player per regular war. Default sort: Town Hall high to low, then newest war.",
    cols: [C("th","TH",{num:1}), C("name","Name"), C("tag","Tag"), C("clan","Clan"), C("date","War start",{fmt:fmtDate}),
           C("opponent","Opponent"), C("result","Result",{html:result}), C("state","State"), C("pos","Map #",{num:1}),
           C("attacksUsed","Used",{num:1}), C("attacksAvailable","Avail",{num:1}), C("missed","Missed",{num:1}),
           C("stars","Stars",{num:1}), C("avgDestruction","Avg destr %",{num:1}), C("attackDetail","Attacks"),
           C("timesAttacked","Defended",{num:1}), C("defStars","Def ★",{num:1,fmt:star})] },
  cwl_summary: { label: "CWL summary", file: "cwl_summary.json",
    note: "Totals over CWL wars that have ended and been recorded since tracking began.",
    cols: [C("th","TH",{num:1}), C("name","Name"), C("tag","Tag"), C("clan","Clan"), C("wars","Wars",{num:1}),
           C("attacksUsed","Attacks",{num:1}), C("attacksAvailable","Available",{num:1}), C("missed","Missed",{num:1}),
           C("stars","Stars",{num:1}), C("threeStars","3★",{num:1}), C("avgStarsPerAttack","Stars/atk",{num:1}), C("avgDestruction","Avg destr %",{num:1})] },
  cwl: { label: "CWL", file: "cwl.json",
    note: "One row per player per Clan War League day. Default sort: Town Hall high to low, then newest war.",
    cols: [C("th","TH",{num:1}), C("name","Name"), C("tag","Tag"), C("clan","Clan"), C("season","Season"), C("date","War start",{fmt:fmtDate}),
           C("opponent","Opponent"), C("result","Result",{html:result}), C("state","State"), C("pos","Map #",{num:1}),
           C("attacksUsed","Used",{num:1}), C("missed","Missed",{num:1}), C("stars","Stars",{num:1}),
           C("avgDestruction","Destr %",{num:1}), C("attackDetail","Attack"), C("timesAttacked","Defended",{num:1}), C("defStars","Def ★",{num:1,fmt:star})] },
};

const state = { tab: "members", data: {}, sortKey: "th", sortDir: -1, tieSort: true };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

async function getJSON(f) {
  const r = await fetch(`data/${f}?t=${Date.now()}`);
  if (!r.ok) return [];
  return r.json();
}

async function init() {
  const meta = await getJSON("meta.json");
  const clans = meta.clans || [];
  $("meta").textContent = meta.updatedAt
    ? `Updated ${new Date(meta.updatedAt).toLocaleString()} · ${clans.length} clans`
    : "No data yet. Run the crawl workflow once.";
  const sel = $("clan");
  clans.forEach(c => sel.append(new Option(`${c.name} (${c.tag})`, c.name)));
  $("errs").textContent = (meta.errors || []).length ? "Crawler warnings: " + meta.errors.slice(0, 3).join(" | ") + ((meta.errors.length > 3) ? ` (+${meta.errors.length - 3} more)` : "") : "";
  const nav = $("tabs");
  Object.entries(TABS).forEach(([id, t]) => {
    const b = document.createElement("button");
    b.className = "tab"; b.role = "tab"; b.textContent = t.label; b.dataset.id = id;
    b.onclick = () => selectTab(id);
    nav.append(b);
  });
  ["q", "clan", "former"].forEach(id => $(id).addEventListener("input", render));
  $("csv").onclick = downloadCSV;
  selectTab("members");
}

async function selectTab(id) {
  state.tab = id; state.sortKey = "th"; state.sortDir = -1;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.id === id));
  $("formerWrap").style.display = TABS[id].former ? "" : "none";
  $("note").textContent = TABS[id].note;
  if (!state.data[id]) state.data[id] = await getJSON(TABS[id].file);
  render();
}

function rows() {
  const t = TABS[state.tab];
  const q = $("q").value.trim().toLowerCase(), clan = $("clan").value, former = $("former").checked;
  let r = state.data[state.tab] || [];
  if (t.former && !former) r = r.filter(x => x.status === "active");
  if (clan) r = r.filter(x => x.clan === clan);
  if (q) r = r.filter(x => (x.name || "").toLowerCase().includes(q) || (x.tag || "").toLowerCase().includes(q));
  const k = state.sortKey, d = state.sortDir;
  return [...r].sort((a, b) => {
    const x = a[k], y = b[k];
    if (x == null && y == null) return 0;
    if (x == null) return 1; if (y == null) return -1;
    let c = typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y));
    if (c === 0 && k !== "th") c = (a.th || 0) - (b.th || 0);   // keep TH order inside ties
    return c * d;
  });
}

function cell(col, row) {
  const v = row[col.key];
  if (col.html) return col.html(v);
  return esc(col.fmt ? col.fmt(v) : v);
}

function render() {
  const t = TABS[state.tab], r = rows();
  const head = t.cols.map(c => `<th class="${c.num ? "num" : ""}" data-k="${c.key}">${esc(c.label)}${state.sortKey === c.key ? `<span class="arrow">${state.sortDir < 0 ? "▼" : "▲"}</span>` : ""}</th>`).join("");
  const body = r.map(x => `<tr>${t.cols.map(c => `<td class="${c.num ? "num" : ""}">${cell(c, x)}</td>`).join("")}</tr>`).join("");
  $("table").innerHTML = `<thead><tr>${head}</tr></thead><tbody>${body || `<tr><td colspan="${t.cols.length}" class="muted">No rows yet.</td></tr>`}</tbody>`;
  $("count").textContent = `${r.length} rows`;
  $("table").querySelectorAll("th").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (state.sortKey === k) state.sortDir *= -1; else { state.sortKey = k; state.sortDir = k === "th" || t.cols.find(c => c.key === k).num ? -1 : 1; }
    render();
  });
}

function downloadCSV() {
  const t = TABS[state.tab], r = rows();
  const q = v => { v = String(v ?? ""); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const lines = [t.cols.map(c => q(c.label)).join(",")].concat(r.map(x => t.cols.map(c => q(c.fmt ? c.fmt(x[c.key]) : x[c.key])).join(",")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
  a.download = `${state.tab}.csv`; a.click();
}

init();
</script>
</body>
</html>
