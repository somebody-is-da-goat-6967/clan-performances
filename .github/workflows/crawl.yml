name: Crawl clans

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may delay runs a few minutes)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl
        env:
          COC_API_TOKEN: ${{ secrets.COC_API_TOKEN }}
          COC_API_BASE: ${{ vars.COC_API_BASE }}   # optional, e.g. https://cocproxy.royaleapi.dev/v1
        run: |
          if [ -z "$COC_API_BASE" ]; then unset COC_API_BASE; fi
          python crawler/crawl.py
      - name: Commit data
        run: |
          git config user.name "coc-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
